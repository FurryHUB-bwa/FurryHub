<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurryHub | Creative Community</title>
    
    <link rel="icon" type="image/png" href="furryhub.png">

    <style>
        :root {
            --primary: #ff8c00;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            background-color: #000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a, .login-trigger, .logout-trigger {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
            font-family: inherit;
        }

        .nav-links a:hover, .login-trigger:hover, .logout-trigger:hover {
            color: var(--primary);
        }

        .logout-trigger {
            color: #ff4444;
        }

        /* Hero Section */
        header {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://via.placeholder.com/1200x400');
            background-size: cover;
            background-position: center;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Main Content Area */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 5%;
            text-align: center;
        }

        .nova-btn {
            display: inline-block;
            background-color: var(--primary);
            color: #000;
            padding: 20px 60px;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
            text-transform: uppercase;
        }

        .nova-btn:hover {
            transform: translateY(-3px);
            background-color: #ffa500;
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.5);
        }

        /* MODAL STYLES */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid var(--primary);
            min-width: 320px;
            position: relative;
        }

        .google-btn {
            background-color: white;
            color: #757575;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto 0;
            cursor: pointer;
            width: 100%;
        }

        .google-btn img {
            width: 20px;
            margin-right: 10px;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 20px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">FURRYHUB</a>
        <div class="nav-links">
            <a href="novabeast.html">Gallery</a>
            <a href="#">Artists</a>
            <a href="#">Forums</a>
            
            <button class="login-trigger" id="loginBtn">Login</button>
            <span id="userGreeting" style="margin-left: 20px; color: var(--primary); display: none; font-weight: bold;"></span>
            <button class="logout-trigger" id="logoutBtn" style="display: none;">Logout</button>
        </div>
    </nav>

    <header>
        <h1>Welcome to the Den</h1>
        <p>Connecting creators and enthusiasts across the globe.</p>
    </header>

    <div class="container">
        <a href="novabeast.html" class="nova-btn">Novabeast</a>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeLogin">&times;</span>
            <h2 style="color: var(--primary); margin-top: 0;">Login</h2>
            <p>Sign in to access all features</p>
            <button class="google-btn" id="googleSignIn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Sign in with Google
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBa-9QIAo7l9mKud-n6VwQt9b_mCZGrolA",
            authDomain: "furryhub-490aa.firebaseapp.com",
            projectId: "furryhub-490aa",
            storageBucket: "furryhub-490aa.firebasestorage.app",
            messagingSenderId: "302089297923",
            appId: "1:302089297923:web:e3e41b2f4f1537ab54ee36",
            measurementId: "G-D4QRXPJ6DP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginModal = document.getElementById("loginModal");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const userGreeting = document.getElementById("userGreeting");

        loginBtn.onclick = () => loginModal.style.display = "flex";
        document.getElementById("closeLogin").onclick = () => loginModal.style.display = "none";
        window.onclick = (e) => { if(e.target == loginModal) loginModal.style.display = "none"; }

        document.getElementById("googleSignIn").onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
                loginModal.style.display = "none";
            } catch (error) {
                alert("Login Error: " + error.message);
            }
        };

        logoutBtn.onclick = async () => {
            try {
                await signOut(auth);
                alert("You have been logged out.");
            } catch (error) {
                alert("Logout Error: " + error.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginBtn.style.display = "none";
                userGreeting.style.display = "inline";
                logoutBtn.style.display = "inline";
                userGreeting.innerText = "Hey, " + user.displayName.split(' ')[0] + "!";
            } else {
                loginBtn.style.display = "inline";
                userGreeting.style.display = "none";
                logoutBtn.style.display = "none";
            }
        });
    </script>

</body>
</html>
