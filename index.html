<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurryHub | Creative Community</title>
    <style>
        :root {
            --primary: #ff8c00;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            background-color: #000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Hero Section */
        header {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://via.placeholder.com/1200x400');
            background-size: cover;
            background-position: center;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Main Content Area */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 5%;
            text-align: center;
        }

        /* Novabeast Button Styles */
        .nova-btn {
            display: inline-block;
            background-color: var(--primary);
            color: #000;
            padding: 20px 60px;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
            text-transform: uppercase;
        }

        .nova-btn:hover {
            transform: translateY(-3px);
            background-color: #ffa500;
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.5);
        }

        .nova-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">FURRYHUB</div>
        <div class="nav-links">
            <a href="#">Gallery</a>
            <a href="#">Artists</a>
            <a href="#">Forums</a>
            <a href="#">Login</a>
        </div>
    </nav>

    <header>
        <h1>Welcome to the Den</h1>
        <p>Connecting creators and enthusiasts across the globe.</p>
    </header>

    <div class="container">
        <a href="novabeast.html" class="nova-btn">Novabeast</a>
    </div>

</body>
</html>
