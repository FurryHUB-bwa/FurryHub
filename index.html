<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurryHub | Creative Community</title>
    <style>
        :root {
            --primary: #ff8c00;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* Navigation */
        nav {
            background-color: #000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Hero Section */
        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://via.placeholder.com/1200x400');
            background-size: cover;
        }

        /* Gallery Grid */
        .container {
            padding: 40px 5%;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-info {
            padding: 15px;
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .tag {
            font-size: 0.8rem;
            background: var(--primary);
            color: black;
            padding: 2px 8px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">FURRYHUB</div>
        <div class="nav-links">
            <a href="#">Gallery</a>
            <a href="#">Artists</a>
            <a href="#">Forums</a>
            <a href="#">Login</a>
        </div>
    </nav>

    <header>
        <h1>Welcome to the Den</h1>
        <p>Connecting creators and enthusiasts across the globe.</p>
    </header>

    <div class="container">
        <h2>Recent Submissions</h2>
        <div class="gallery">
            <div class="card">
                <img src="https://via.placeholder.com/300" alt="Art">
                <div class="card-info">
                    <div class="card-title">Golden Sunset</div>
                    <span class="tag">Digital Art</span>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300" alt="Art">
                <div class="card-info">
                    <div class="card-title">Forest Run</div>
                    <span class="tag">Traditional</span>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300" alt="Art">
                <div class="card-info">
                    <div class="card-title">Neon Night</div>
                    <span class="tag">Animation</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
