<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurryHub | Novabeast Den</title>
    <style>
        :root {
            --primary: #ff8c00;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a, .login-trigger {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
            font-family: inherit;
        }

        .nav-links a:hover, .login-trigger:hover {
            color: var(--primary);
        }

        .container {
            padding: 40px 5%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 1px solid #333;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .card-details {
            padding: 15px;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* MODALS (Image & Login) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid var(--primary);
            min-width: 300px;
        }

        .google-btn {
            background-color: white;
            color: #757575;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto 0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .google-btn:hover {
            background-color: #f1f1f1;
        }

        .google-btn img {
            width: 20px;
            margin-right: 10px;
        }

        .modal img.zoom-view {
            max-width: 90%;
            max-height: 80%;
            border-radius: 8px;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        #loading-msg {
            text-align: center;
            font-style: italic;
            color: #888;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">FURRYHUB</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">Upload</a>
            <button class="login-trigger" id="openLogin">Login</button>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Novabeast Gallery</h1>
            <p>Exploring the digital frontier of Novabeast avatars and art.</p>
        </header>

        <div id="loading-msg">Connecting to FurryHub Database...</div>
        <div class="gallery-grid" id="novabeast-gallery"></div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="closeModals()">&times;</span>
        <img id="modalImg" class="zoom-view" src="" alt="Zoomed view">
        <div id="caption" style="color: var(--primary); margin-top:15px; font-weight:bold;"></div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModals()">&times;</span>
            <h2 style="color: var(--primary); margin-top: 0;">Account Login</h2>
            <p>Join the FurryHub community</p>
            <button class="google-btn" id="googleSignIn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Sign in with Google
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBa-9QIAo7l9mKud-n6VwQt9b_mCZGrolA",
            authDomain: "furryhub-490aa.firebaseapp.com",
            projectId: "furryhub-490aa",
            storageBucket: "furryhub-490aa.firebasestorage.app",
            messagingSenderId: "302089297923",
            appId: "1:302089297923:web:e3e41b2f4f1537ab54ee36",
            measurementId: "G-D4QRXPJ6DP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // UI Element Selectors
        const imgModal = document.getElementById("imageModal");
        const loginModal = document.getElementById("loginModal");

        // Open Login Modal
        document.getElementById("openLogin").onclick = () => {
            loginModal.style.display = "flex";
        };

        // Google Sign In Logic
        document.getElementById("googleSignIn").onclick = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                alert("Welcome, " + result.user.displayName + "!");
                loginModal.style.display = "none";
            } catch (error) {
                console.error(error);
                alert("Login failed: " + error.message);
            }
        };

        // Gallery Image Zoom Logic
        window.openImage = (url, name) => {
            imgModal.style.display = "flex";
            document.getElementById("modalImg").src = url;
            document.getElementById("caption").innerText = name;
        };

        // Close functions
        window.closeModals = () => {
            imgModal.style.display = "none";
            loginModal.style.display = "none";
        };

        // Close on background click
        window.onclick = (event) => {
            if (event.target == imgModal || event.target == loginModal) {
                closeModals();
            }
        };

        // Load Gallery
        async function loadNovabeasts() {
            const galleryElement = document.getElementById('novabeast-gallery');
            const loadingMsg = document.getElementById('loading-msg');
            try {
                const querySnapshot = await getDocs(collection(db, "novabeasts"));
                loadingMsg.style.display = 'none';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openImage(data.imageUrl, data.name);
                    card.innerHTML = `
                        <img src="${data.imageUrl}" alt="Art">
                        <div class="card-details">
                            <div class="card-title">${data.name || 'Untitled'}</div>
                        </div>
                    `;
                    galleryElement.appendChild(card);
                });
            } catch (error) {
                loadingMsg.innerText = "Error loading data.";
            }
        }
        loadNovabeasts();
    </script>
</body>
</html>
