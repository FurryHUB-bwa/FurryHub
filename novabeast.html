<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurryHub | Novabeast Den</title>
    <style>
        :root {
            --primary: #ff8c00;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a, .login-trigger, .upload-trigger {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
            font-family: inherit;
        }

        .nav-links a:hover, .login-trigger:hover, .upload-trigger:hover {
            color: var(--primary);
        }

        .container {
            padding: 40px 5%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 1px solid #333;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .card-details {
            padding: 15px;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* MODALS */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid var(--primary);
            min-width: 320px;
            position: relative;
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .upload-form input {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #121212;
            color: white;
        }

        .submit-btn {
            background: var(--primary);
            color: black;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .google-btn {
            background-color: white;
            color: #757575;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto 0;
            cursor: pointer;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">FURRYHUB</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <button class="upload-trigger" id="btnUpload">Upload</button>
            <button class="login-trigger" id="openLogin">Login</button>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Novabeast Gallery</h1>
            <p>Exploring the digital frontier of Novabeast avatars and art.</p>
        </header>

        <div id="loading-msg" style="text-align: center; color: #888;">Connecting to Database...</div>
        <div class="gallery-grid" id="novabeast-gallery"></div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="closeModals()">&times;</span>
        <img id="modalImg" style="max-width:90%; max-height:80%; border-radius:8px;" src="" alt="Zoomed view">
        <div id="caption" style="color: var(--primary); margin-top:15px; font-weight:bold;"></div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModals()">&times;</span>
            
            <div id="loggedOutUI">
                <h2 style="color: var(--primary); margin-top: 0;">Account Login</h2>
                <p>Join the FurryHub community</p>
                <button class="google-btn" id="googleSignIn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width:20px; margin-right:10px;">
                    Sign in with Google
                </button>
            </div>

            <div id="loggedInUI" style="display: none;">
                <h2 style="color: var(--primary); margin-top: 0;">User Account</h2>
                <p id="userEmail" style="color: #888;"></p>
                <button class="logout-btn" id="btnLogOut">Log Out</button>
            </div>
        </div>
    </div>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModals()">&times;</span>
            <h2 style="color: var(--primary); margin-top: 0;">Upload Novabeast</h2>
            <form class="upload-form" id="uploadForm">
                <input type="text" id="newName" placeholder="Novabeast Name" required>
                <input type="url" id="newUrl" placeholder="Image URL (Direct link)" required>
                <button type="submit" class="submit-btn">Post to Gallery</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBa-9QIAo7l9mKud-n6VwQt9b_mCZGrolA",
            authDomain: "furryhub-490aa.firebaseapp.com",
            projectId: "furryhub-490aa",
            storageBucket: "furryhub-490aa.firebasestorage.app",
            messagingSenderId: "302089297923",
            appId: "1:302089297923:web:e3e41b2f4f1537ab54ee36",
            measurementId: "G-D4QRXPJ6DP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // UI Selectors
        const loginModal = document.getElementById("loginModal");
        const loggedOutUI = document.getElementById("loggedOutUI");
        const loggedInUI = document.getElementById("loggedInUI");
        const userEmailText = document.getElementById("userEmail");
        const btnLoginNav = document.getElementById("openLogin");

        // Auth Tracker logic
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                btnLoginNav.innerText = user.displayName.split(' ')[0];
                loggedOutUI.style.display = "none";
                loggedInUI.style.display = "block";
                userEmailText.innerText = user.email;
            } else {
                btnLoginNav.innerText = "Login";
                loggedOutUI.style.display = "block";
                loggedInUI.style.display = "none";
            }
        });

        // Logout logic
        document.getElementById("btnLogOut").onclick = async () => {
            try {
                await signOut(auth);
                alert("Logged out successfully!");
                closeModals();
            } catch (e) {
                alert("Error logging out");
            }
        };

        // Open/Close Modals
        btnLoginNav.onclick = () => loginModal.style.display = "flex";
        
        window.closeModals = () => {
            document.querySelectorAll('.modal').forEach(m => m.style.display = "none");
        };

        // Standard Sign In
        document.getElementById("googleSignIn").onclick = async () => {
            try { await signInWithPopup(auth, provider); closeModals(); }
            catch (e) { alert("Login failed"); }
        };

        // Upload Logic
        document.getElementById("btnUpload").onclick = () => {
            if (!currentUser) {
                alert("Please login first to upload!");
                loginModal.style.display = "flex";
            } else {
                document.getElementById("uploadModal").style.display = "flex";
            }
        };

        document.getElementById("uploadForm").onsubmit = async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "novabeasts"), {
                    name: document.getElementById("newName").value,
                    imageUrl: document.getElementById("newUrl").value,
                    uploadedBy: currentUser.uid,
                    timestamp: new Date()
                });
                location.reload();
            } catch (err) { alert("Error uploading"); }
        };

        // Load Gallery
        async function loadNovabeasts() {
            const galleryElement = document.getElementById('novabeast-gallery');
            const querySnapshot = await getDocs(collection(db, "novabeasts"));
            document.getElementById('loading-msg').style.display = 'none';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${data.imageUrl}"><div class="card-details"><div class="card-title">${data.name || 'Untitled'}</div></div>`;
                card.onclick = () => {
                    document.getElementById("imageModal").style.display = "flex";
                    document.getElementById("modalImg").src = data.imageUrl;
                    document.getElementById("caption").innerText = data.name;
                };
                galleryElement.appendChild(card);
            });
        }
        loadNovabeasts();

        // Close on outside click
        window.onclick = (e) => { if(e.target.classList.contains('modal')) closeModals(); };
    </script>
</body>
</html>
