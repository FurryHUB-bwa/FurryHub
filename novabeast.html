<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurryHub | Novabeast Den</title>
    <style>
        :root {
            --primary: #ff8c00;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            padding: 40px 5%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 1px solid #333;
            cursor: pointer; /* Makes it clear it's clickable */
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .card-details {
            padding: 15px;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* LIGHTBOX / MODAL STYLES */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: zoom-out;
        }

        .modal img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: default;
        }

        .modal-caption {
            color: var(--primary);
            margin-top: 15px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        #loading-msg {
            text-align: center;
            font-style: italic;
            color: #888;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">FURRYHUB</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">Upload</a>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Novabeast Gallery</h1>
            <p>Exploring the digital frontier of Novabeast avatars and art.</p>
        </header>

        <div id="loading-msg">Connecting to FurryHub Database...</div>
        <div class="gallery-grid" id="novabeast-gallery"></div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img id="modalImg" src="" alt="Zoomed view">
        <div id="caption" class="modal-caption"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBa-9QIAo7l9mKud-n6VwQt9b_mCZGrolA",
            authDomain: "furryhub-490aa.firebaseapp.com",
            projectId: "furryhub-490aa",
            storageBucket: "furryhub-490aa.firebasestorage.app",
            messagingSenderId: "302089297923",
            appId: "1:302089297923:web:e3e41b2f4f1537ab54ee36",
            measurementId: "G-D4QRXPJ6DP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Modal Elements
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImg");
        const captionText = document.getElementById("caption");

        // Function to open modal
        function openImage(url, name) {
            modal.style.display = "flex";
            modalImg.src = url;
            captionText.innerHTML = name;
        }

        // Close modal when clicking 'X' or background
        modal.onclick = () => { modal.style.display = "none"; }

        async function loadNovabeasts() {
            const galleryElement = document.getElementById('novabeast-gallery');
            const loadingMsg = document.getElementById('loading-msg');

            try {
                const querySnapshot = await getDocs(collection(db, "novabeasts"));
                loadingMsg.style.display = 'none';

                if (querySnapshot.empty) {
                    loadingMsg.style.display = 'block';
                    loadingMsg.innerText = "No Novabeasts found. Add some in the Firebase Console!";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${data.imageUrl}" alt="Novabeast Art" onerror="this.src='https://via.placeholder.com/300x300?text=Image+Error'">
                        <div class="card-details">
                            <div class="card-title">${data.name || 'Untitled Novabeast'}</div>
                        </div>
                    `;

                    // Add click event to card to trigger the zoom
                    card.onclick = () => openImage(data.imageUrl, data.name || 'Untitled Novabeast');
                    
                    galleryElement.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading images: ", error);
                loadingMsg.innerText = "Error: Check your Firestore 'Rules' tab.";
            }
        }

        loadNovabeasts();
    </script>
</body>
</html>
